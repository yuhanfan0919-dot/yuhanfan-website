<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Rain Fan logo</title>
  <desc id="desc">A soft lavender orbit loop with three nodes and a purple serif R.</desc>
  <defs>
    <linearGradient id="bg" x1="15" y1="13" x2="113" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F7FF"/>
      <stop offset="0.55" stop-color="#EFF1FF"/>
      <stop offset="1" stop-color="#E8EBFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="31" y1="28" x2="101" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7AEFF"/>
      <stop offset="0.45" stop-color="#8588F0"/>
      <stop offset="1" stop-color="#6257D3"/>
    </linearGradient>
    <linearGradient id="rPurple" x1="82" y1="43" x2="104" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CA5FF"/>
      <stop offset="0.45" stop-color="#7E7BEF"/>
      <stop offset="1" stop-color="#5B4CCB"/>
    </linearGradient>
    <linearGradient id="nodeTop" x1="51" y1="19" x2="78" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8C0FF"/>
      <stop offset="1" stop-color="#8990F4"/>
    </linearGradient>
    <linearGradient id="nodeMid" x1="21" y1="61" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#969CFA"/>
      <stop offset="1" stop-color="#7273DF"/>
    </linearGradient>
    <linearGradient id="nodeLow" x1="72" y1="80" x2="103" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#776FE4"/>
      <stop offset="1" stop-color="#5B4CCB"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#bg)"/>

  <path
    d="M87.8 31.2A39.5 39.5 0 1 0 99.3 76.9"
    fill="none"
    stroke="url(#orbit)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <text
    x="93.4"
    y="66.8"
    fill="url(#rPurple)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="31"
    font-style="italic"
    font-weight="700"
    text-anchor="middle"
  >R</text>

  <circle cx="64" cy="33.5" r="12.2" fill="url(#nodeTop)"/>
  <circle cx="64" cy="33.5" r="6.8" fill="#FFFFFF"/>

  <circle cx="35.2" cy="73.2" r="12.2" fill="url(#nodeMid)"/>
  <circle cx="35.2" cy="73.2" r="6.8" fill="#FFFFFF"/>

  <circle cx="83.8" cy="91.3" r="12.2" fill="url(#nodeLow)"/>
  <circle cx="83.8" cy="91.3" r="6.8" fill="#FFFFFF"/>
</svg>
